name: Test Lunch Bot

on:
  push:
    paths: ["**.js", "package.json", "examples/**", "data-10f/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["**.js", "package.json", "examples/**", "data-10f/**", ".github/workflows/test.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
